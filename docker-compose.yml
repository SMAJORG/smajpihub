version: "3.9"
services:
  reverse-proxy:
    build: ./reverse-proxy
    environment:
      HTTPS: ${HTTPS}
      FRONTEND_DOMAIN_NAME: ${FRONTEND_DOMAIN_NAME}
      BACKEND_DOMAIN_NAME: ${BACKEND_DOMAIN_NAME}
      DOMAIN_VALIDATION_KEY: ${DOMAIN_VALIDATION_KEY}
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - ${DATA_DIRECTORY}/reverse-proxy/etc-letsencrypt:/etc/letsencrypt/

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    environment:
      BACKEND_URL: ${BACKEND_URL}
      SANDBOX_SDK: ${SANDBOX_SDK}

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      RUNNING_IN_CONTAINER: "true"
      NODE_ENV: ${ENVIRONMENT}
      SESSION_SECRET: ${SESSION_SECRET}
      PI_API_KEY: ${PI_API_KEY}
      SANDBOX_SDK: ${SANDBOX_SDK}
      PLATFORM_API_URL: ${PLATFORM_API_URL}
      MONGO_HOST: mongo
      MONGODB_DATABASE_NAME: ${MONGODB_DATABASE_NAME}
      MONGODB_USERNAME: ${MONGODB_USERNAME}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      TRANSLATION_API_URL: ${TRANSLATION_API_URL:-http://libretranslate:5000}
      TRANSLATION_API_KEY: ${TRANSLATION_API_KEY:-}

  libretranslate:
    image: libretranslate/libretranslate:latest
    environment:
      LT_LOAD_ONLY: en,fr
      LT_DISABLE_WEB_UI: "true"
      LT_BATCH_LIMIT: "50"
      LT_CHAR_LIMIT: "100000"
    volumes:
      - ${DATA_DIRECTORY}/libretranslate:/home/libretranslate/.local
    expose:
      - "5000"

  mongo:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    expose:
      - "27017"
    volumes:
      - ${DATA_DIRECTORY}/mongo/data:/data/db
