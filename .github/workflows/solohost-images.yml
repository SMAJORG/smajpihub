name: Publish SoloHost images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable SoloHost release version, for example 0.1.0
        required: true
        default: "0.1.0"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Version must use numeric semver such as 0.1.0" >&2; exit 1 ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: solohost/web/Dockerfile
          push: true
          tags: ghcr.io/smajorg/smajpihub-web:${{ inputs.version }}
          provenance: mode=max
          sbom: true

      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/smajorg/smajpihub-backend:${{ inputs.version }}
          provenance: mode=max
          sbom: true
