name: Theme consistency

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
      - name: Test theme checker
        run: npm run test:theme-check --prefix frontend
      - name: Check added interface colors
        env:
          THEME_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ -z "$THEME_BASE" || "$THEME_BASE" =~ ^0+$ ]]; then
            THEME_BASE=$(git rev-list --max-parents=0 HEAD)
          fi
          npm run check:theme --prefix frontend -- --base "$THEME_BASE"

  desktop-theme-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Check all desktop panels in light and dark mode
        run: npm run test:header:browser --prefix frontend -- --grep "desktop panels follow"
