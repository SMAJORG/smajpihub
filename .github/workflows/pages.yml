name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Use Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Build backend
        run: npm run build --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend (GitHub Pages public mode)
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || vars.VITE_BACKEND_URL || 'https://smajpihub.onrender.com' }}
          VITE_BACKEND_URL: ${{ vars.VITE_API_BASE_URL || vars.VITE_BACKEND_URL || 'https://smajpihub.onrender.com' }}
          VITE_SMAJ_AI_PUBLIC_URL: ${{ vars.VITE_SMAJ_AI_PUBLIC_URL || 'https://smaj-verified-delegation.onrender.com' }}
          VITE_SANDBOX_SDK: "true"
          VITE_BUILD_ID: ${{ github.sha }}
        run: npm run build:public --prefix frontend

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: frontend/dist-public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deploy_attempt_1
        uses: actions/deploy-pages@v5.0.0
        continue-on-error: true
        with:
          timeout: 600000
          error_count: 20

      - name: Retry GitHub Pages deploy
        id: deploy_attempt_2
        if: steps.deploy_attempt_1.outcome == 'failure'
        uses: actions/deploy-pages@v5.0.0
        continue-on-error: true
        with:
          timeout: 600000
          error_count: 20

      - name: Final GitHub Pages deploy retry
        id: deploy_attempt_3
        if: steps.deploy_attempt_1.outcome == 'failure' && steps.deploy_attempt_2.outcome == 'failure'
        uses: actions/deploy-pages@v5.0.0
        continue-on-error: true
        with:
          timeout: 600000
          error_count: 20

      - name: Verify deployment
        if: steps.deploy_attempt_1.outcome == 'failure' && steps.deploy_attempt_2.outcome == 'failure' && steps.deploy_attempt_3.outcome == 'failure'
        run: exit 1
