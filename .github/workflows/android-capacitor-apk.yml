name: Build Capacitor Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/android-capacitor-apk.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: npm ci

      - name: Build and sync Capacitor
        run: npm run android:sync

      - name: Build installable APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/SMAJ-PI-HUB.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMAJ-PI-HUB-Android
          path: frontend/android/app/build/outputs/apk/debug/SMAJ-PI-HUB.apk
          if-no-files-found: error

      - name: Publish public APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest --repo "$GITHUB_REPOSITORY" || gh release create android-latest --repo "$GITHUB_REPOSITORY" --title "SMAJ PI HUB Android" --notes "Latest installable SMAJ PI HUB Android preview build." --prerelease --target "$GITHUB_SHA"
          gh release upload android-latest android/app/build/outputs/apk/debug/SMAJ-PI-HUB.apk --repo "$GITHUB_REPOSITORY" --clobber
