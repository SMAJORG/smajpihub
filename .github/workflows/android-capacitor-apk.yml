name: Build Capacitor Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VITE_APP_VERSION: 1.0.${{ github.run_number }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Restore persistent APK signing key
        env:
          SMAJ_ANDROID_KEYSTORE_BASE64: ${{ secrets.SMAJ_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SMAJ_ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Configure SMAJ_ANDROID_KEYSTORE_BASE64 and SMAJ_ANDROID_KEYSTORE_PASSWORD repository secrets. Refusing to create an incompatible signing key."
            exit 1
          fi
          umask 077
          printf '%s' "$SMAJ_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/smaj-updates.keystore"

      - name: Install web dependencies
        run: npm ci

      - name: Build and sync Capacitor
        env:
          SMAJ_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/smaj-updates.keystore
          SMAJ_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SMAJ_ANDROID_KEYSTORE_PASSWORD }}
        run: npm run android:sync

      - name: Build installable APK
        env:
          SMAJ_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/smaj-updates.keystore
          SMAJ_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SMAJ_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/SMAJ-PI-HUB.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMAJ-PI-HUB-Android
          path: frontend/android/app/build/outputs/apk/debug/SMAJ-PI-HUB.apk
          if-no-files-found: error

      - name: Publish public APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest --repo "$GITHUB_REPOSITORY" || gh release create android-latest --repo "$GITHUB_REPOSITORY" --title "SMAJ PI HUB Android" --notes "Latest installable SMAJ PI HUB Android preview build." --prerelease --target "$GITHUB_SHA"
          gh release upload android-latest android/app/build/outputs/apk/debug/SMAJ-PI-HUB.apk --repo "$GITHUB_REPOSITORY" --clobber
          printf 'Version: %s\n\nThe latest SMAJ PI HUB Android build includes the newest fixes and improvements.\n' "$VITE_APP_VERSION" > "$RUNNER_TEMP/smaj-release-notes.txt"
          gh release edit android-latest --repo "$GITHUB_REPOSITORY" --title "SMAJ PI HUB Android $VITE_APP_VERSION" --notes-file "$RUNNER_TEMP/smaj-release-notes.txt"
