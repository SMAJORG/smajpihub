<html lang="en">

    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Vite does not use %PUBLIC_URL% -->

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111827" />

    <meta name="application-name" content="SMAJ PI HUB" />
    <meta name="apple-mobile-web-app-title" content="SMAJ PI HUB" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />
    <meta property="og:title" content="SMAJ PI HUB | The Pi-Powered Super App for Real-World Utility" />
    <meta property="og:description" content="A Pi-powered platform connecting verified users to marketplace, services, opportunities, and real-world digital solutions through Pi Network." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://smajpihub.com/" />
    <meta property="og:site_name" content="SMAJ PI HUB" />
    <meta property="og:image" content="https://smajpihub.com/logo.png" />
    <meta property="og:image:alt" content="SMAJ PI HUB official logo" />
    <meta name="tagline" content="One Pi Identity. One Wallet. Multiple Services. Real Utility." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SMAJ PI HUB | The Pi-Powered Super App for Real-World Utility" />
    <meta name="twitter:description" content="A Pi-powered platform connecting verified users to marketplace, services, opportunities, and real-world digital solutions through Pi Network." />
    <meta name="twitter:image" content="https://smajpihub.com/logo.png" />
    <meta name="twitter:image:alt" content="SMAJ PI HUB official logo" />
    <link rel="canonical" href="https://smajpihub.com/" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="shortcut icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "SMAJ PI HUB",
        "alternateName": "SMAJ PI HUB",
        "url": "https://smajpihub.com/"
      }
    </script>

    <!--
    Runtime environment variables
    These values are:
    - replaced in DEV by Vite (via import.meta.env if needed)
    - replaced in PROD by Docker entrypoint (string replace)
  -->
    <script>
      window.__ENV = {
        apiBaseURL: "$$API_BASE_URL$$",
        backendURL: "$$BACKEND_URL$$",
        sandbox: "$$SANDBOX_SDK$$",
      };
      window.__SMAJ_BUILD = "%VITE_BUILD_ID%";
    </script>

    <!-- Pi Network SDK -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>

    <meta name="google-adsense-account" content="ca-pub-5794291397799733">
<script>
      const runSDKInSandboxMode =
        window.__ENV.sandbox === "true" ||
        window.location.hostname === "sandbox.minepi.com" ||
        document.referrer.includes("sandbox.minepi.com");
      if (window.Pi?.init) {
        window.Pi.init({
          version: "2.0",
          sandbox: runSDKInSandboxMode,
        });
      } else {
        console.warn("Pi SDK not available at startup; app will continue without immediate Pi init.");
      }
    </script>

    <title>SMAJ PI HUB | The Pi-Powered Super App for Real-World Utility</title>
    <link rel="preload" href="/logo.png" as="image" />
    <style>
      .smaj-startup-splash { position: fixed; inset: 0; z-index: 2147483647; display: grid; place-items: center; padding: 32px 24px; box-sizing: border-box; color: #2b1b3f; background: #ffffff; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; }
      .smaj-startup-splash > div { display: grid; justify-items: center; gap: 14px; }
      .smaj-startup-splash img { width: clamp(132px, 34vw, 220px); height: auto; display: block; object-fit: contain; animation: smajStartupPulse 1.7s ease-in-out infinite; }
      .smaj-startup-splash h1 { margin: 14px 0 0; color: #6d28d9; font-size: clamp(1.22rem, 5.2vw, 3rem); line-height: 1.08; letter-spacing: -.035em; white-space: nowrap; }
      .smaj-startup-splash p { margin: 0; color: #f59e0b; font-size: clamp(.82rem, 3vw, 1rem); font-weight: 850; letter-spacing: .16em; text-transform: uppercase; }
      .smaj-startup-splash small { margin-top: -7px; color: #7c6f8d; font-size: clamp(.62rem, 2.25vw, .78rem); font-weight: 700; letter-spacing: .035em; }
      @keyframes smajStartupPulse { 0%, 100% { transform: scale(.92); } 50% { transform: scale(1.06); } }
      @media (prefers-reduced-motion: reduce) { .smaj-startup-splash img { animation: none; } }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="root">
      <main class="smaj-startup-splash" role="status" aria-live="polite" aria-label="Loading SMAJ PI HUB">
        <div>
          <img src="/logo.png" alt="SMAJ PI HUB" />
          <h1>Welcome to <strong>SMAJ PI HUB</strong></h1>
          <p>Powered by Pi</p>
          <small>Part of the SMAJ Ecosystem</small>
        </div>
      </main>
    </div>

    <!-- Vite entry -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
